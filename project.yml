name: AsraySplit
options:
  bundleIdPrefix: com.asray
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  AsraySplit:
    type: application
    platform: iOS
    sources: [AsraySplit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asray.AsraySplit
        INFOPLIST_FILE: AsraySplit/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [AsraySplitTests]
  AsraySplitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AsraySplitTests]
    dependencies:
      - target: AsraySplit


name: AsraySplit
options:
  bundleIdPrefix: com.asray
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  # supabase-swift 2.30.0 is the newest release whose manifest supports the Swift 5.9 toolchain (Xcode 15.2).
  # Its transitive xctest-dynamic-overlay/swift-clocks are pinned to versions that compile with Swift 5.9.
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.30.0
  XCTestDynamicOverlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: 1.2.2
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    exactVersion: 1.0.4
targets:
  AsraySplit:
    type: application
    platform: iOS
    sources:
      - path: AsraySplit
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - target: AsraySplitShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: AsraySplit/Info.plist
        CODE_SIGN_ENTITLEMENTS: AsraySplit/AsraySplit.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: AsraySplit
    scheme:
      testTargets: [AsraySplitTests, AsraySplitUITests]
      gatherCoverageData: true
  AsraySplitShare:
    type: app-extension
    platform: iOS
    sources:
      - path: AsraySplitShare
      - path: AsraySplit/Core/Support/SharedInbox.swift
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        INFOPLIST_FILE: AsraySplitShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: AsraySplitShare/AsraySplitShare.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_NAME: AsraySplitShare
  AsraySplitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AsraySplitTests]
    dependencies:
      - target: AsraySplit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AsraySplitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AsraySplitUITests]
    dependencies:
      - target: AsraySplit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AsraySplit
